name: deploy demo

# The demo is a static build with no backend — every visitor gets their own
# localStorage, seeded with the demo family, so nothing is shared between them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The date and roster tests, before anything is built. A demo that is
      # wrong about when a holiday falls, or drops half a roster, is worse
      # than a demo that is a few minutes out of date — so this blocks the
      # deploy rather than reporting alongside it.
      - run: npm test

      # typechecks as well as builds — a broken demo is worse than no demo
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
