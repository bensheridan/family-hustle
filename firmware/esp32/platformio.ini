; Family hustle sync box — ESP32-S3 with 16 MB flash and 8 MB PSRAM (N16R8).
; See README.md. The PSRAM is required: a whole PUT body is held in it.

[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; the serial console on the board's own USB port, not the UART pins — the
; setup over USB in README.md happens there
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
extra_scripts =
  pre:guard_partitions.py
  post:native_mklittlefs.py
lib_deps =
  mathieucarbou/ESPAsyncWebServer @ ^3.3.0
  bblanchon/ArduinoJson @ ^7.2.0
